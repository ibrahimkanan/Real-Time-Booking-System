version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: booking_postgres_v2
    restart: always
    environment:
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass123
      POSTGRES_DB: booking_db
    ports:
      - "5444:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: booking_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata_v2:
  redisdata: